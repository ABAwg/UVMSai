name: UVMS AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Dependency consistency
        run: pip check
      - name: Python vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Compile API
        run: python -m compileall -q app migrations
      - name: API tests
        env:
          UVMS_JWT_SECRET: ci-only-secret-key-longer-than-thirty-two-characters
        run: PYTHONPATH=. pytest -q
      - name: Alembic clean-database smoke test
        env:
          UVMS_DATABASE_URL: sqlite:///./ci_migration.db
          UVMS_JWT_SECRET: ci-only-secret-key-longer-than-thirty-two-characters
        run: |
          rm -f ci_migration.db
          alembic upgrade head
          alembic current
          alembic check
          rm -f ci_migration.db

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck

  production-config:
    runs-on: ubuntu-latest
    env:
      UVMS_ENV: production
      UVMS_JWT_SECRET: ci-production-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      POSTGRES_DB: uvms_ai
      POSTGRES_USER: uvms
      POSTGRES_PASSWORD: ci-strong-postgres-password-0123456789
      UVMS_PUBLIC_WEB_URL: https://ai.example.invalid
      UVMS_CORS_ORIGINS: https://ai.example.invalid
      UVMS_TRUSTED_HOSTS: ai.example.invalid
      UVMS_REFRESH_COOKIE_SECURE: 'true'
      UVMS_METRICS_TOKEN: ci-metrics-token-0123456789abcdef
      UVMS_PASSWORD_RESET_ENABLED: 'false'
      UVMS_STORAGE_BACKEND: local
      UVMS_BILLING_PROVIDER: disabled
      UVMS_REQUIRE_LIVE_AI: 'true'
      UVMS_AI_PROVIDER: openai
      OPENAI_API_KEY: ci-placeholder-provider-key
      UVMS_MAX_REQUEST_MB: '105'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Production preflight
        run: python ops/production_preflight.py /dev/null
      - name: Shell syntax
        run: bash -n ops/backup_postgres.sh ops/restore_postgres.sh
      - name: Compose syntax
        run: docker compose -f docker-compose.prod.yml config >/dev/null
      - name: API production image builds
        run: docker build -t uvms-ai-api-ci services/api
      - name: API image runs as non-root
        run: test "$(docker run --rm --entrypoint id uvms-ai-api-ci -u)" = "10001"
