x-logging: &bounded-logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uvms_ai}
      POSTGRES_USER: ${POSTGRES_USER:-uvms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - uvms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - uvms_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks: [backend]

  api:
    build: { context: ./services/api }
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 1g
    init: true
    stop_grace_period: 45s
    env_file: ["${UVMS_ENV_FILE:-.env}"]
    environment:
      UVMS_ENV: production
      UVMS_REDIS_URL: redis://redis:6379/0
      UVMS_STORAGE_DIR: /data/uploads
      UVMS_REFRESH_COOKIE_SECURE: "true"
      UVMS_REQUIRE_LIVE_AI: "true"
      UVMS_ALLOW_DEMO_IN_PRODUCTION: "false"
      UVMS_BILLING_PROVIDER: ${UVMS_BILLING_PROVIDER:-disabled}
      UVMS_RELEASE_VERSION: ${UVMS_RELEASE_VERSION:-1.4.3}
      UVMS_SEED_ON_STARTUP: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-uvms_ai}
      POSTGRES_USER: ${POSTGRES_USER:-uvms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - uvms_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2).read()"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    networks: [backend, egress]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 512m
    init: true
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 128m
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uvms_acme:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s
    networks: [frontend, backend]

networks:
  frontend: {}
  backend:
    internal: true
  # API needs outbound HTTPS to Groq. This network publishes no host ports.
  egress: {}

volumes:
  uvms_postgres:
  uvms_redis:
  uvms_uploads:
  uvms_acme:
  uvms_certificates:
